name: armv7 probe

# **A probe, not a release target.** 32-bit ARM (`armhf` / Debian's
# `ARMv7-A + VFPv3`) has been asked for by a listener who wants a decode node on
# older ARM hardware (fork discussion #13), and the honest position is that
# **this tree has never been built for it**: every ARM artifact this project
# publishes is 64-bit `aarch64`, and aarch64 taught us what a new architecture
# costs — a rustc codegen pathology put six release jobs to sleep for six hours
# with nothing written, which is why every build step is pinned to 1.98.1.
#
# So the build is the answer to his question. It either produces a binary or
# names the crate that will not cross-compile, and both are worth having.
#
# **Deliberately its own workflow rather than a matrix entry in `release.yml`.**
# `create release` needs every build job, so a target that is *expected* to fail
# the first time must not be able to fail a release. When this goes green and
# has run on someone's hardware, folding it into the release matrix is the right
# next step — and only then.
#
# `--no-default-features` is the build he asked for: no SoapySDR (the whole
# point — its C dependencies are the reason 32-bit ARM is awkward) and no
# rtl_433. What it does **not** remove is the other vendored C, because it is
# not behind a feature: faad2 and dream (DRM), nrsc5 (HD Radio), xng (HFDL) and
# rade_c (RADE) are pulled unconditionally by their decoder crates. **That is
# where this will break if it breaks.**
#
# **Two hand-rolled attempts failed, and the failures are the reason `cross` is
# here.** The Rust side cross-compiles fine — the second run compiled hundreds
# of crates for the target. It stopped at `alsa-sys`, the sound-card binding:
#
#     pkg-config has not been configured to support cross-compilation
#
# An amd64 runner has no armhf `libasound`. Adding the architecture by hand and
# installing `libasound2-dev:armhf` from the Ubuntu port **did not take** — the
# log shows the cross toolchain installing and no `libasound2-dev` at all, no
# fetch from `ports.ubuntu.com`, and `PKG_CONFIG_ALLOW_CROSS` never reaching the
# build script. That is a sysroot problem, so it gets a sysroot: `cross` runs
# the build in a container whose image already carries a complete armhf sysroot,
# and `Dockerfile.cross-armv7` adds the one library the tree needs on top of it.
#
# **`cross` cleared that and then stopped in the vendored C, in `opus`:**
#
#     silk/arm/biquad_alt_neon_intr.c: error: inlining failed in call to
#     'always_inline' 'vadd_s32': target specific option mismatch
#
# NEON intrinsics compiled without `-mfpu=neon`. The obvious fix — hand the
# build `-mfpu=neon-vfpv4` — is **wrong here**, and that is the point of this
# probe: Debian's `armhf` is ARMv7-A + VFPv3 and NEON is *not* part of that
# baseline, so a NEON build can die with SIGILL on hardware that is otherwise
# supported. Opus's own switch for this is `OPUS_DISABLE_INTRINSICS`, which its
# build script exposes only as the `no-simd` feature, so the build turns it on
# through `sdroxide-server/arm-no-simd` — off by default, and the only thing
# that pulls `opusic-sys` into that crate at all.

on:
  workflow_dispatch:

jobs:
  armv7:
    name: linux-armv7 (cat)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: armv7-unknown-linux-gnueabihf

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-armv7-cat

      # `cross` (cross-rs/cross) is the sysroot the hand-rolled step could not
      # build. It compiles natively and links against the container's armhf
      # root, so the target's `libasound` comes from the image rather than from
      # apt on the runner.
      - name: Install cross
        run: cargo install cross --locked

      - name: Build (cat - no SoapySDR, no rtl_433)
        # **The plain (un-suffixed) tool variables, and they are the point.**
        # `rade_c`'s CMake builds its own opus in an `ExternalProject` that runs
        # autotools `./configure`, and `BuildOpus.cmake` only passes
        # `--host=${CMAKE_C_COMPILER_TARGET}` when CMake knows it is
        # cross-compiling — which our wrapper CMake is not, since it runs on the
        # runner. So that comes out empty, opus's configure falls back to the
        # bare `cc`, and in the cross *container* `cc` is the host compiler: the
        # rade rlib came back "file format not recognized" at the final link
        # because it was a mix of armhf and x86-64 objects.
        #
        # `cross` sets the `_armv7_unknown_linux_gnueabihf`-suffixed ones, which
        # cargo's own crates honour. Autotools does not read those, so the
        # un-suffixed names are set here for the nested build.
        env:
          CC: arm-linux-gnueabihf-gcc
          CXX: arm-linux-gnueabihf-g++
          AR: arm-linux-gnueabihf-ar
          RANLIB: arm-linux-gnueabihf-ranlib
          LD: arm-linux-gnueabihf-ld
        run: |
          cross build --release --locked \
            --target armv7-unknown-linux-gnueabihf \
            -p sdroxide --no-default-features \
            --features sdroxide-server/arm-no-simd

      - name: What came out
        run: |
          file target/armv7-unknown-linux-gnueabihf/release/sdroxide
          ls -la target/armv7-unknown-linux-gnueabihf/release/sdroxide

      - uses: actions/upload-artifact@v7
        with:
          name: sdroxide-linux-armv7-cat
          path: target/armv7-unknown-linux-gnueabihf/release/sdroxide
