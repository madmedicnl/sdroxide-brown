[target.armv7-unknown-linux-gnueabihf]
dockerfile = "Dockerfile.cross-armv7"

# **The un-suffixed tool variables have to be let into the container.**
#
# `rade_c`'s CMake builds its own opus in an `ExternalProject` that runs
# autotools, and `BuildOpus.cmake` passes `--host=${CMAKE_C_COMPILER_TARGET}`
# only when CMake knows it is cross-compiling — our wrapper CMake runs natively,
# so that is empty and opus's `./configure` falls back to the bare `cc`. In the
# cross container `cc` is the *host* compiler, which is how the rade rlib ended
# up mixing armhf and x86-64 objects and came back "file format not recognized"
# at the final link (run 37600953267).
#
# `cross` sets the `_armv7_unknown_linux_gnueabihf`-suffixed variables itself,
# and cargo's own crates read those. Autotools does not — but `cross` passes
# only a whitelist of the host environment into the container, so naming them on
# the step was not enough. This is the whitelist.
[build.env]
passthrough = ["CC", "CXX", "AR", "RANLIB", "LD", "NM", "STRIP"]
