[package]
name = "antenna-model"
version = "0.1.0"
edition = "2024"

# A standalone prototype, not a member of the root workspace. Without this table
# cargo walks up from here, finds the root manifest and refuses to build the
# tool at all — the same reason `tools/rsp1-capture` carries one. `members =
# ["crates/*"]` does not reach `tools/`, so the root build never sees this.
[workspace]

[lib]
name = "antenna_model"
path = "src/lib.rs"

[[bin]]
name = "antenna"
path = "src/main.rs"

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` matters: the default float parser is best-effort and shifts
# the last bit of a coordinate, so a saved design would not reload byte-identical
# and the round-trip test would (correctly) fail.
serde_json = { version = "1", features = ["float_roundtrip"] }
