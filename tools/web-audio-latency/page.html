<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>sdroxide web audio latency harness</title>
<script>
    // The rate the context is given. The bridge asks for 48 kHz; a browser or a
    // device that will not give it falls back to the hardware rate, which is
    // one of the things under test, so the rate is chosen here -- before the
    // bridge loads and builds its context.
    window.__contexts = [];
    window.__requestedRate = Number(new URLSearchParams(location.search).get("rate") || 48000);
    (function () {
        // Nothing is silent: a throw while loading is the answer to the
        // question, and it has to reach the runner.
        function report(line) {
            try { fetch("/result?line=" + encodeURIComponent(line)); } catch (e) {}
        }
        window.__report = report;
        window.addEventListener("error", (e) =>
            report("FAIL script error: " + (e.message || e.error))
        );
        window.addEventListener("unhandledrejection", (e) =>
            report("FAIL rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason))
        );

        const Real = window.AudioContext;
        function Observed(...args) {
            const opts = Object.assign({}, args[0] || {});
            if (window.__requestedRate) opts.sampleRate = window.__requestedRate;
            const c = new Real(opts);
            window.__contexts.push(c);
            return c;
        }
        Observed.prototype = Real.prototype;
        window.AudioContext = Observed;

        // The player reports what it has rendered and how much it still holds.
        // The harness listens on the same port, beside the bridge's handler, so
        // the measurement does not depend on the bridge keeping the number.
        const RealNode = window.AudioWorkletNode;
        function ObservedNode(ctx, name, opts) {
            const n = new RealNode(ctx, name, opts);
            if (name === "pcm-player" && n.port && n.port.addEventListener) {
                window.__player = n;
                n.port.addEventListener("message", (ev) => {
                    const d = ev.data;
                    if (d && typeof d.queued === "number") window.__playerReport = d;
                });
            }
            return n;
        }
        ObservedNode.prototype = RealNode.prototype;
        window.AudioWorkletNode = ObservedNode;

        // No Sound welcome layer over the page: it swallows the first gesture
        // by design, and this harness needs the bridge's ordinary path.
        try { localStorage.setItem("sdroxide-sound-welcome", "0"); } catch (e) {}
        report("note page loading " + location.href);
    })();
</script>
<script src="audio_bridge.js"></script>
<script src="harness.js"></script>
</head>
<body></body>
</html>
