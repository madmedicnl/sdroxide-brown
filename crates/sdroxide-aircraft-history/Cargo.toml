[package]
name = "sdroxide-aircraft-history"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What the station has heard of each aircraft in the last day: its positions, the callsigns and registrations it used, and the cards the relay gave for it — a pure model, kept by the server and read by the client"

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Gzip for the file once it grows (`gz`): server only, so the client build never
# carries it. Already in the tree through ureq.
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }

[features]
gzip = ["dep:flate2"]

[dev-dependencies]
# So the plain `cargo test` of this crate runs the gzip tests too.
sdroxide-aircraft-history = { path = ".", features = ["gzip"] }
