[package]
name = "sdroxide-types"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
# Parses the bundled broadcast-station table (src/broadcast_stations.json) at
# first use, and round-trip tests for the types `sdroxide-config` persists.
# Pure Rust, so the crate still builds for wasm32.
serde_json = "1"

[dev-dependencies]
# Round-trip tests for the types that ride the wire.
postcard.workspace = true
# The format the browser build stores `UiSettings` in (eframe's storage), so the
# web half of the settings round trip is tested where the type is defined.
ron = "0.12"
